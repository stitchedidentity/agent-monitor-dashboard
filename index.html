<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Performance Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        .dashboard-section {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .section-title {
            font-size: 22px;
            color: #333;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .kpi-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .agent-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .score {
            font-size: 14px;
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .score-value {
            font-size: 18px;
            font-weight: bold;
            background: rgba(255,255,255,0.2);
            padding: 5px 10px;
            border-radius: 5px;
        }

        .orders-badge {
            background: #ffd700;
            color: #333;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 10px;
            display: inline-block;
        }

        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .filter-group select {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        .filter-group select:hover {
            border-color: #667eea;
        }

        .alerts-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .alerts-table thead {
            background: #f8f9fa;
        }

        .alerts-table th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #ddd;
        }

        .alerts-table td {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        .alerts-table tr:hover {
            background: #f8f9fa;
        }

        .issue-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .issue-rudeness {
            background: #ffebee;
            color: #c62828;
        }

        .issue-late-response {
            background: #fff3e0;
            color: #e65100;
        }

        .issue-incomplete-answer {
            background: #f3e5f5;
            color: #6a1b9a;
        }

        .issue-not-addressing {
            background: #ede7f6;
            color: #512da8;
        }

        .issue-product-knowledge {
            background: #e0f2f1;
            color: #00695c;
        }

        .severity-critical {
            color: #c62828;
            font-weight: bold;
        }

        .severity-warning {
            color: #f57c00;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 16px;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 14px;
        }

        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 20px;
        }

        .refresh-btn:hover {
            background: #764ba2;
        }

        .customer-name {
            font-weight: 600;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 Agent Performance Monitor</h1>
            <p class="subtitle">Real-time quality monitoring for your sales team</p>
        </header>

        <!-- KPI Dashboard -->
        <div class="dashboard-section">
            <h2 class="section-title">📊 Agent KPIs (Last 7 Days)</h2>
            <div class="kpi-grid" id="kpiGrid">
                <div class="loading">Loading agent data...</div>
            </div>
        </div>

        <!-- Alerts Section -->
        <div class="dashboard-section">
            <h2 class="section-title">⚠️ Quality Alerts</h2>

            <!-- Filters -->
            <div class="filters">
                <div class="filter-group">
                    <label for="agentFilter">Filter by Agent:</label>
                    <select id="agentFilter">
                        <option value="">All Agents</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="issueFilter">Filter by Issue Type:</label>
                    <select id="issueFilter">
                        <option value="">All Issues</option>
                        <option value="Rudeness">Rudeness</option>
                        <option value="Late Response">Late Response</option>
                        <option value="Incomplete Answer">Incomplete Answer</option>
                        <option value="Not Addressing Question">Not Addressing Question</option>
                        <option value="Product Knowledge">Product Knowledge</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="dateFilter">Filter by Date:</label>
                    <select id="dateFilter">
                        <option value="7">Last 7 Days</option>
                        <option value="1">Today</option>
                        <option value="30">Last 30 Days</option>
                    </select>
                </div>
            </div>

            <table class="alerts-table">
                <thead>
                    <tr>
                        <th>Customer</th>
                        <th>Agent</th>
                        <th>Issue</th>
                        <th>Severity</th>
                        <th>Details</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="alertsTableBody">
                    <tr><td colspan="6" class="loading">Loading alerts...</td></tr>
                </tbody>
            </table>

            <button class="refresh-btn" onclick="refreshData()">🔄 Refresh Data</button>
        </div>
    </div>

    <script>
        const API_BASE = 'https://agent-monitor-va.onrender.com';
        console.log('Dashboard connecting to:', API_BASE);

        async function loadKPIData() {
            try {
                const response = await fetch(`${API_BASE}/api/dashboard`);
                const data = await response.json();

                const kpiGrid = document.getElementById('kpiGrid');
                kpiGrid.innerHTML = '';

                data.forEach(agent => {
                    const card = document.createElement('div');
                    card.className = 'kpi-card';
                    card.innerHTML = `
                        <div class="agent-name">${agent.agent_name}</div>
                        <div class="score">
                            <span>Professionalism</span>
                            <span class="score-value">${agent.professionalism_score}%</span>
                        </div>
                        <div class="score">
                            <span>Completeness</span>
                            <span class="score-value">${agent.completeness_score}%</span>
                        </div>
                        <div class="score">
                            <span>Guidance</span>
                            <span class="score-value">${agent.guidance_score}%</span>
                        </div>
                        <div class="score">
                            <span>Overall</span>
                            <span class="score-value">${agent.overall_score}%</span>
                        </div>
                        <div class="score">
                            <span>Conversations</span>
                            <span class="score-value">${agent.total_conversations}</span>
                        </div>
                        ${agent.orders_count > 0 ? `<div class="orders-badge">📦 ${agent.orders_count} Orders</div>` : ''}
                    `;
                    kpiGrid.appendChild(card);
                });
            } catch (error) {
                console.error('Error loading KPI data:', error);
                document.getElementById('kpiGrid').innerHTML = '<div class="no-data">Failed to load data</div>';
            }
        }

        async function loadAlerts() {
            try {
                const agent = document.getElementById('agentFilter').value;
                const issue = document.getElementById('issueFilter').value;
                const dateRange = document.getElementById('dateFilter').value;

                const params = new URLSearchParams();
                if (agent) params.append('agent', agent);
                if (issue) params.append('issue', issue);
                if (dateRange) params.append('dateRange', dateRange);

                const response = await fetch(`${API_BASE}/api/alerts?${params}`);
                const data = await response.json();

                const tbody = document.getElementById('alertsTableBody');
                tbody.innerHTML = '';

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="no-data">No alerts found</td></tr>';
                    return;
                }

                data.forEach(alert => {
                    const row = document.createElement('tr');
                    const issueBadgeClass = `issue-${alert.issue_type.toLowerCase().replace(/\s+/g, '-')}`;
                    const date = new Date(alert.created_at).toLocaleDateString();

                    row.innerHTML = `
                        <td><span class="customer-name">${alert.customer_name}</span></td>
                        <td>${alert.agent_name}</td>
                        <td><span class="issue-badge ${issueBadgeClass}">${alert.issue_type}</span></td>
                        <td><span class="severity-${alert.severity}">${alert.severity.toUpperCase()}</span></td>
                        <td>${alert.message}</td>
                        <td>${date}</td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error('Error loading alerts:', error);
                document.getElementById('alertsTableBody').innerHTML = '<tr><td colspan="6" class="no-data">Failed to load alerts</td></tr>';
            }
        }

        async function loadFilterOptions() {
            try {
                const response = await fetch(`${API_BASE}/api/alert-filters`);
                const data = await response.json();

                const agentSelect = document.getElementById('agentFilter');
                data.agents.forEach(agent => {
                    const option = document.createElement('option');
                    option.value = agent;
                    option.textContent = agent;
                    agentSelect.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading filters:', error);
            }
        }

        function refreshData() {
            loadKPIData();
            loadAlerts();
        }

        // Load data on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadKPIData();
            loadAlerts();
            loadFilterOptions();

            // Reload alerts when filters change
            document.getElementById('agentFilter').addEventListener('change', loadAlerts);
            document.getElementById('issueFilter').addEventListener('change', loadAlerts);
            document.getElementById('dateFilter').addEventListener('change', loadAlerts);
        });

        // Auto-refresh every 5 minutes
        setInterval(refreshData, 300000);
    </script>
</body>
</html>
