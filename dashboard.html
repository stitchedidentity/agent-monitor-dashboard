<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Performance Monitor - Real-Time Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            color: #333;
            font-size: 28px;
        }

        .time-display {
            color: #666;
            font-size: 14px;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        button:hover {
            background: #764ba2;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 1200px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .refresh-indicator {
            width: 10px;
            height: 10px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 2s infinite;
            display: inline-block;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .agent-card {
            background: #f9fafb;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: transform 0.2s;
        }

        .agent-card:hover {
            transform: translateX(5px);
        }

        .agent-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .agent-name {
            font-weight: bold;
            color: #333;
            font-size: 16px;
        }

        .score {
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            color: white;
            font-size: 14px;
        }

        .score.excellent {
            background: #10b981;
        }

        .score.good {
            background: #3b82f6;
        }

        .score.warning {
            background: #f59e0b;
        }

        .score.critical {
            background: #ef4444;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .stat {
            background: white;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }

        .stat-label {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
        }

        .stat-value {
            color: #333;
            font-size: 18px;
            font-weight: bold;
            margin-top: 5px;
        }

        .alert-item {
            background: #fef2f2;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #ef4444;
            max-height: 120px;
            overflow-y: auto;
        }

        .alert-item.warning {
            background: #fffbeb;
            border-left-color: #f59e0b;
        }

        .alert-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 8px;
        }

        .alert-agent {
            font-weight: bold;
            color: #333;
        }

        .alert-time {
            color: #999;
            font-size: 12px;
        }

        .alert-type {
            display: inline-block;
            padding: 3px 8px;
            background: #ef4444;
            color: white;
            border-radius: 3px;
            font-size: 11px;
            font-weight: bold;
            margin-top: 5px;
        }

        .alert-type.warning {
            background: #f59e0b;
        }

        .alert-message {
            color: #333;
            font-size: 13px;
            margin-top: 8px;
            line-height: 1.4;
        }

        .quote {
            background: #f3f4f6;
            padding: 10px;
            border-radius: 4px;
            font-size: 12px;
            color: #666;
            margin-top: 8px;
            font-style: italic;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .no-alerts {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-close {
            float: right;
            cursor: pointer;
            font-size: 24px;
            color: #999;
        }

        .modal-close:hover {
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #f3f4f6;
            font-weight: bold;
            color: #333;
        }

        tr:hover {
            background: #f9fafb;
        }

        .summary {
            background: #f0f9ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #0ea5e9;
        }

        .summary-text {
            color: #333;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>🎯 Agent Performance Monitor</h1>
                <p class="time-display" id="timeDisplay"></p>
            </div>
            <div class="controls">
                <button onclick="refreshDashboard()">🔄 Refresh Now</button>
                <button onclick="openWeeklyReport()">📊 Weekly Report</button>
            </div>
        </header>

        <div class="dashboard-grid">
            <div class="card">
                <h2><span class="refresh-indicator"></span> Live Agent Performance</h2>
                <div id="agentsList" class="loading">
                    <div class="spinner"></div> Loading agents...
                </div>
            </div>

            <div class="card">
                <h2>🚨 Real-Time Alerts</h2>
                <div id="alertsList" class="loading">
                    <div class="spinner"></div> Loading alerts...
                </div>
            </div>

            <div class="card full-width">
                <h2>📋 Recent Activity (Last 24 Hours)</h2>
                <div id="recentActivity" class="loading">
                    <div class="spinner"></div> Loading activity...
                </div>
            </div>
        </div>
    </div>

    <!-- Weekly Report Modal -->
    <div id="reportModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeWeeklyReport()">&times;</span>
            <h2>📊 Weekly Agent Performance Report</h2>
            <div id="reportContent" class="loading">
                <div class="spinner"></div> Generating report...
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://agent-monitor-vf24.onrender.com/api';

        // Update time display
        function updateTime() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };
            document.getElementById('timeDisplay').textContent = now.toLocaleDateString('en-US', options);
        }
        updateTime();
        setInterval(updateTime, 1000);

        // Fetch and display agent performance
        async function loadAgentPerformance() {
            try {
                const response = await fetch(`${API_BASE}/dashboard`);
                const data = await response.json();

                const html = data.map(agent => {
                    const scoreClass = agent.overall_score >= 90 ? 'excellent' : 
                                      agent.overall_score >= 75 ? 'good' : 
                                      agent.overall_score >= 60 ? 'warning' : 'critical';

                    return `
                        <div class="agent-card">
                            <div class="agent-header">
                                <span class="agent-name">${agent.agent_name}</span>
                                <span class="score ${scoreClass}">${agent.overall_score}%</span>
                            </div>
                            <div class="stats-row">
                                <div class="stat">
                                    <div class="stat-label">Conversations</div>
                                    <div class="stat-value">${agent.total_conversations}</div>
                                </div>
                                <div class="stat">
                                    <div class="stat-label">Late Responses</div>
                                    <div class="stat-value">${agent.late_responses}</div>
                                </div>
                                <div class="stat">
                                    <div class="stat-label">Rude Tone</div>
                                    <div class="stat-value">${agent.rude_tone_flags}</div>
                                </div>
                                <div class="stat">
                                    <div class="stat-label">Incomplete</div>
                                    <div class="stat-value">${agent.incomplete_answers}</div>
                                </div>
                                <div class="stat">
                                    <div class="stat-label">Poor Guidance</div>
                                    <div class="stat-value">${agent.poor_guidance_flags}</div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                document.getElementById('agentsList').innerHTML = html || '<div class="no-alerts">No data available yet</div>';
            } catch (error) {
                document.getElementById('agentsList').innerHTML = `<div class="no-alerts">Error loading data: ${error.message}</div>`;
                console.error('Error loading agents:', error);
            }
        }

        // Fetch and display real-time alerts
        async function loadAlerts() {
            try {
                const response = await fetch(`${API_BASE}/alerts/realtime`);
                const data = await response.json();

                if (data.length === 0) {
                    document.getElementById('alertsList').innerHTML = '<div class="no-alerts">✅ No alerts in the last 24 hours</div>';
                    return;
                }

                const html = data.slice(0, 15).map(alert => {
                    const time = new Date(alert.created_at).toLocaleTimeString();
                    const typeClass = alert.issue_type === 'rude_tone' || alert.issue_type === 'critical' ? '' : 'warning';

                    return `
                        <div class="alert-item ${typeClass}">
                            <div class="alert-header">
                                <span class="alert-agent">${alert.agent_name}</span>
                                <span class="alert-time">${time}</span>
                            </div>
                            <span class="alert-type ${typeClass}">${alert.issue_type.replace(/_/g, ' ').toUpperCase()}</span>
                            <div class="alert-message">${alert.message}</div>
                            <div class="quote">"${alert.analyzed_message.substring(0, 150)}..."</div>
                        </div>
                    `;
                }).join('');

                document.getElementById('alertsList').innerHTML = html;
            } catch (error) {
                document.getElementById('alertsList').innerHTML = `<div class="no-alerts">Error loading alerts: ${error.message}</div>`;
                console.error('Error loading alerts:', error);
            }
        }

        // Fetch recent activity
        async function loadRecentActivity() {
            try {
                const response = await fetch(`${API_BASE}/dashboard`);
                const data = await response.json();

                const html = `
                    <table>
                        <thead>
                            <tr>
                                <th>Agent</th>
                                <th>Total</th>
                                <th>Late</th>
                                <th>Rude</th>
                                <th>Incomplete</th>
                                <th>Poor Guidance</th>
                                <th>Score</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${data.map(agent => `
                                <tr>
                                    <td><strong>${agent.agent_name}</strong></td>
                                    <td>${agent.total_conversations}</td>
                                    <td>${agent.late_responses}</td>
                                    <td>${agent.rude_tone_flags}</td>
                                    <td>${agent.incomplete_answers}</td>
                                    <td>${agent.poor_guidance_flags}</td>
                                    <td><strong>${agent.overall_score}%</strong></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;

                document.getElementById('recentActivity').innerHTML = html;
            } catch (error) {
                document.getElementById('recentActivity').innerHTML = `<div class="no-alerts">Error loading activity: ${error.message}</div>`;
                console.error('Error loading activity:', error);
            }
        }

        // Open weekly report
        async function openWeeklyReport() {
            document.getElementById('reportModal').classList.add('active');
            await loadWeeklyReport();
        }

        // Load and display weekly report
        async function loadWeeklyReport() {
            try {
                const response = await fetch(`${API_BASE}/dashboard`);
                const data = await response.json();

                const weekStart = new Date();
                weekStart.setDate(weekStart.getDate() - weekStart.getDay() + 1);

                let html = `
                    <div class="summary">
                        <div class="summary-text">
                            <strong>Report Period:</strong> ${weekStart.toLocaleDateString()} - ${new Date().toLocaleDateString()}<br>
                            <strong>Total Agents Monitored:</strong> ${data.length}<br>
                            <strong>Data Last Updated:</strong> ${new Date().toLocaleString()}
                        </div>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>Agent</th>
                                <th>Conversations</th>
                                <th>Late Responses</th>
                                <th>Rude Tone</th>
                                <th>Incomplete Answers</th>
                                <th>Poor Guidance</th>
                                <th>Overall Score</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                data.forEach(agent => {
                    html += `
                        <tr>
                            <td><strong>${agent.agent_name}</strong></td>
                            <td>${agent.total_conversations}</td>
                            <td>${agent.late_responses}</td>
                            <td>${agent.rude_tone_flags}</td>
                            <td>${agent.incomplete_answers}</td>
                            <td>${agent.poor_guidance_flags}</td>
                            <td><strong>${agent.overall_score}%</strong></td>
                        </tr>
                    `;
                });

                html += `
                        </tbody>
                    </table>
                    <p style="margin-top: 20px; color: #666; font-size: 12px;">
                        Report generated on ${new Date().toLocaleString()}
                    </p>
                `;

                document.getElementById('reportContent').innerHTML = html;
            } catch (error) {
                document.getElementById('reportContent').innerHTML = `<div class="no-alerts">Error generating report: ${error.message}</div>`;
                console.error('Error loading report:', error);
            }
        }

        // Close weekly report
        function closeWeeklyReport() {
            document.getElementById('reportModal').classList.remove('active');
        }

        // Refresh dashboard
        async function refreshDashboard() {
            await loadAgentPerformance();
            await loadAlerts();
            await loadRecentActivity();
        }

        // Initial load
        loadAgentPerformance();
        loadAlerts();
        loadRecentActivity();

        // Auto-refresh every 30 seconds
        setInterval(() => {
            loadAlerts();
            loadAgentPerformance();
        }, 30000);

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('reportModal');
            if (event.target == modal) {
                modal.classList.remove('active');
            }
        }
    </script>
</body>
</html>
